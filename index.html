<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cursed — profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #534AB7;
      --purple-light: #7F77DD;
      --white: #FFFFFF;
      --bg: #FAFAFA;
      --text: #1F1F1F;
      --text-dim: #737373;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F0F0F;
        --text: #F5F5F5;
        --text-dim: #A3A3A3;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      position: relative;
      overflow: hidden;
    }

    /* Animated background lines */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    svg {
      width: 100%;
      height: 100%;
    }

    .line {
      stroke: var(--purple);
      stroke-width: 1;
      opacity: 0.15;
      filter: blur(0.5px);
    }

    .line1 {
      animation: flow1 8s linear infinite;
    }

    .line2 {
      animation: flow2 10s linear infinite;
    }

    .line3 {
      animation: flow3 12s linear infinite;
    }

    .line4 {
      animation: flow4 9s linear infinite;
    }

    .line5 {
      animation: flow5 11s linear infinite;
    }

    @keyframes flow1 {
      from {
        stroke-dashoffset: 0;
      }
      to {
        stroke-dashoffset: -1000;
      }
    }

    @keyframes flow2 {
      from {
        stroke-dashoffset: 0;
      }
      to {
        stroke-dashoffset: -1200;
      }
    }

    @keyframes flow3 {
      from {
        stroke-dashoffset: 0;
      }
      to {
        stroke-dashoffset: -1400;
      }
    }

    @keyframes flow4 {
      from {
        stroke-dashoffset: 0;
      }
      to {
        stroke-dashoffset: -900;
      }
    }

    @keyframes flow5 {
      from {
        stroke-dashoffset: 0;
      }
      to {
        stroke-dashoffset: -1100;
      }
    }

    /* Glow effect */
    .glow-circle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, var(--purple-light) 0%, transparent 70%);
      opacity: 0.08;
      animation: float 6s ease-in-out infinite;
    }

    .glow-1 {
      width: 300px;
      height: 300px;
      top: -100px;
      right: -100px;
      animation-delay: 0s;
    }

    .glow-2 {
      width: 200px;
      height: 200px;
      bottom: -50px;
      left: -50px;
      animation-delay: 3s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(20px);
      }
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    .card {
      max-width: 360px;
      width: 100%;
      text-align: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: var(--purple);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      animation: avatarPulse 2s ease-in-out infinite;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes avatarPulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(83, 74, 183, 0.7);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(83, 74, 183, 0);
      }
    }

    h1 {
      display: table;
      margin: 0 auto 8px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.015em;
      color: transparent;
      background: linear-gradient(110deg, #a79bff 0%, #d9d0ff 20%, #ffffff 35%, #a99aff 48%, #f0eaff 58%, #8b7cff 76%, #ded6ff 88%, #a79bff 100%);
      background-size: 280% 100%;
      background-position: 100% 50%;
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 0 7px rgba(167, 139, 250, .4));
      animation: fadeUp .8s .25s both, cursedGlimmer 3.4s ease-in-out infinite;
      transition: letter-spacing .45s ease, filter .45s ease;
    }

    h1:hover {
      letter-spacing: 0.09em;
      filter: drop-shadow(0 0 14px rgba(196, 181, 253, .95));
    }

    @keyframes cursedGlimmer {
      0%, 100% { background-position: 100% 50%; filter: drop-shadow(0 0 5px rgba(167, 139, 250, .3)); }
      50% { background-position: 0% 50%; filter: drop-shadow(0 0 12px rgba(196, 181, 253, .8)); }
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .bio {
      color: var(--text-dim);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .socials {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .social-icon {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--white);
      border: 1.5px solid #E5E5E5;
      border-radius: 8px;
      text-decoration: none;
      color: var(--purple);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    @media (prefers-color-scheme: dark) {
      .social-icon {
        background: #1A1A1A;
        border-color: #333333;
      }
    }

    .social-icon svg {
      width: 20px;
      height: 20px;
      position: relative;
      z-index: 2;
    }

    .social-icon::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--purple);
      opacity: 0.1;
      transition: left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-radius: 8px;
    }

    .social-icon:hover {
      border-color: var(--purple);
      transform: translateY(-4px);
    }

    .social-icon:hover::before {
      left: 0;
    }

    .social-icon:hover svg {
      animation: iconBounce 0.6s ease;
    }

    @keyframes iconBounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-4px);
      }
    }


    /* Smooth cursed / lavender motion */
    :root { --purple: #9b6dff; --purple-light: #d7a7ff; }
    body {
      background: radial-gradient(ellipse at 50% 40%, rgba(105, 65, 155, .18), transparent 58%), var(--bg);
      isolation: isolate;
    }
    .bg-animation { opacity: .9; }
    .line { stroke: #b58aff; opacity: .22; stroke-width: 1.25; }
    .line1 { animation: flow1 16s linear infinite; }
    .line2 { animation: flow2 21s linear infinite reverse; }
    .line3 { animation: flow3 25s linear infinite; }
    .line4 { animation: flow4 19s linear infinite reverse; }
    .line5 { animation: flow5 23s linear infinite; }
    .glow-circle { opacity: .15; filter: blur(12px); }
    .glow-1 { animation: float 10s ease-in-out infinite, glowBreathe 7s ease-in-out infinite; }
    .glow-2 { animation: float 12s ease-in-out infinite reverse, glowBreathe 9s ease-in-out infinite reverse; }
    .container { perspective: 1000px; }
    .card {
      padding: 34px 28px 30px;
      border: 1px solid rgba(183, 142, 255, .2);
      border-radius: 28px;
      background: rgba(255, 255, 255, .035);
      box-shadow: 0 18px 70px rgba(74, 35, 120, .10), inset 0 1px rgba(255,255,255,.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      animation: cardEnter 1.1s cubic-bezier(.2,.8,.2,1) both;
      transition: transform .5s cubic-bezier(.2,.8,.2,1), border-color .5s ease, box-shadow .5s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(183, 142, 255, .42);
      box-shadow: 0 25px 85px rgba(100, 50, 160, .17), inset 0 1px rgba(255,255,255,.12);
    }
    .avatar {
      width: 104px; height: 104px; margin-bottom: 25px;
      border: 2px solid rgba(213, 174, 255, .9);
      box-shadow: 0 0 0 6px rgba(155,109,255,.08), 0 0 28px rgba(155,109,255,.32);
      animation: avatarFloat 5s ease-in-out infinite, avatarAura 4s ease-in-out infinite;
      will-change: transform, box-shadow;
    }
    .avatar img { transition: transform .8s cubic-bezier(.2,.8,.2,1), filter .8s ease; }
    .avatar:hover img { transform: scale(1.09) rotate(-2deg); filter: saturate(1.12); }
    h1 {
      letter-spacing: .08em;
      text-transform: lowercase;
      text-shadow: 0 0 24px rgba(181,138,255,.28);
      animation: textReveal .9s .18s both, cursedGlimmer 3.4s ease-in-out infinite;
    }
    .subtitle, .bio { animation: fadeUp .9s .32s both; }
    .social-icon {
      border-color: rgba(181,138,255,.25);
      border-radius: 14px;
      box-shadow: 0 5px 18px rgba(80,40,130,.06);
      transition: transform .45s cubic-bezier(.2,.8,.2,1), background .35s ease, border-color .35s ease, box-shadow .45s ease;
      animation: fadeUp .7s both;
    }
    .social-icon:nth-child(1) { animation-delay: .35s; }
    .social-icon:nth-child(2) { animation-delay: .42s; }
    .social-icon:nth-child(3) { animation-delay: .49s; }
    .social-icon:nth-child(4) { animation-delay: .56s; }
    .social-icon:nth-child(5) { animation-delay: .63s; }
    .social-icon:nth-child(6) { animation-delay: .70s; }
    .social-icon:hover {
      transform: translateY(-6px) scale(1.06);
      background: rgba(155,109,255,.12);
      border-color: #b58aff;
      box-shadow: 0 10px 28px rgba(155,109,255,.2);
    }
    .social-icon svg { transition: transform .45s cubic-bezier(.2,.8,.2,1); }
    .social-icon:hover svg { animation: none; transform: rotate(-6deg) scale(1.12); }
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(24px) scale(.97); filter: blur(8px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes textReveal {
      from { opacity: 0; letter-spacing: .22em; filter: blur(5px); }
      to { opacity: 1; letter-spacing: .08em; filter: blur(0); }
    }
    @keyframes avatarFloat {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-7px) rotate(1deg); }
    }
    @keyframes avatarAura {
      0%, 100% { box-shadow: 0 0 0 5px rgba(155,109,255,.07), 0 0 22px rgba(155,109,255,.24); }
      50% { box-shadow: 0 0 0 9px rgba(155,109,255,.035), 0 0 38px rgba(155,109,255,.42); }
    }
    @keyframes glowBreathe {
      0%, 100% { opacity: .09; transform: scale(.96); }
      50% { opacity: .2; transform: scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }

  </style>
</head>
